<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Betternote</title>

  <!-- Optional: nice rounded fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Nunito:wght@400;700;800&display=swap" rel="stylesheet">

  <link rel="icon" type="image/png" sizes="32x32" href="./Betternote Sunset Pink Icon.png">
<link rel="icon" type="image/png" sizes="16x16" href="./Betternote Sunset Pink Icon.png">
<link rel="apple-touch-icon" sizes="180x180" href="./Betternote Sunset Pink Icon.png">

  <link rel="stylesheet" href="styles.css" />
  <link rel="icon" href="./Betternote Sunset Pink Icon.png">
</head>

    <!-- Main nav -->
<header class="header">
  <div class="wrap header__inner">

    <a class="brand" href="#">
      <img
        class="brand__logo"
        src="./Betternote Sunset Pink Icon.png"
        alt=""
        aria-hidden="true"
      >
      <span class="brand__title">Betternote</span>
    </a>

    <button
      class="navToggle"
      type="button"
      aria-label="Open menu"
      aria-expanded="false"
      aria-controls="primaryNav"
    >
      ☰
    </button>

      <nav class="nav" aria-label="Primary navigation">
        <a href="index.html" class="nav__link">Home</a>
        <a href="contact.html" class="nav__link isActive" aria-current="page">Contact</a>
        <a href="privacy.html" class="nav__link">Privacy Policy</a>


        <span class="nav__divider" aria-hidden="true"></span>

        <a class="nav__cta" href="https://apps.apple.com/us/app/betternote/id6779151500" >Download from the App Store</a>
        
      </nav>
    </div>
  </header>

  <main>
    <div class="wrap" style="padding: 70px 0 90px;">
      <section style="
        background:#fff;
        border:1px solid rgba(0,0,0,0.08);
        border-radius:28px;
        padding:44px;
        box-shadow:0 14px 34px rgba(0,0,0,0.06);
        max-width: 900px;
        margin: 0 auto;
        text-align:center;
      ">
        <h1 style="font-family:'Baloo 2','Nunito',system-ui; font-size:48px; margin:0 0 10px;">
          Thank you!
        </h1>
        <p style="font-family:'Nunito',system-ui; font-size:18px; color:rgba(0,0,0,0.72); line-height:1.8; margin:0 0 22px;">
          Your message was sent successfully. We’ll get back to you as soon as we can 💛
        </p>

        <a class="nav__cta" href="index.html" style="display:inline-block;">
          Back to Home
        </a>
      </section>
    </div>
  </main>

  <footer class="footer">
    <div class="wrap footer__inner">
      <small>© <span id="year"></span> Betternote. All rights reserved.</small>
    </div>
  </footer>

  <script>
    document.getElementById("year").textContent = new Date().getFullYear();
  </script>

</body>
</html>
